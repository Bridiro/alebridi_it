[package]
name = "glyphr-web"
version = "0.1.0"
edition = "2024"
publish = false
description = "glyphr compiled to wasm32 for alebridi.it"

[lib]
crate-type = ["cdylib"]

[dependencies]
glyphr = "0.6"
glyphr-types = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
